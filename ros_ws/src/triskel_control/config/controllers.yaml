controller_manager:
  ros__parameters:
    update_rate: 100
    enforce_command_limits: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    omni_base_controller:
      type: omni_wheel_drive_controller/OmniWheelDriveController
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_state_broadcaster:
  ros__parameters:
    publish_dynamic_joint_states: true

omni_base_controller:
  ros__parameters:
    # Wheel centers are 0.105 m from base_link. Their polar angles are 30,
    # 150, and 270 degrees, so this list is counter-clockwise from the offset.
    wheel_names: [wheel_2, wheel_3, wheel_1]
    wheel_offset: 0.5235987755982988
    robot_radius: 0.105
    wheel_radius: 0.05
    odom_frame_id: odom
    base_frame_id: base_link
    tf_frame_prefix_enable: false
    diagonal_covariance:
      pose: [0.001, 0.001, 0.0, 0.0, 0.0, 0.01]
      twist: [0.001, 0.001, 0.0, 0.0, 0.0, 0.01]
    open_loop: false
    position_feedback: false
    enable_odom_tf: true
    cmd_vel_timeout: 0.25

arm_controller:
  ros__parameters:
    joints: [arm_1, arm_2, arm_3, arm_4, arm_5, arm_6, arm_7]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    # The STS driver preserves measured positions but initializes command
    # interfaces to zero. Seed trajectories from feedback so activation cannot
    # create a stale command/limiter history or move real hardware toward zero.
    set_last_command_interface_value_as_state_on_activation: false
    allow_partial_joints_goal: false
    action_monitor_rate: 20.0
    constraints:
      stopped_velocity_tolerance: 0.02
      goal_time: 1.0

gripper_controller:
  ros__parameters:
    joints: [gripper_1]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    set_last_command_interface_value_as_state_on_activation: false
    allow_partial_joints_goal: false
    action_monitor_rate: 20.0
    constraints:
      stopped_velocity_tolerance: 0.02
      goal_time: 1.0
