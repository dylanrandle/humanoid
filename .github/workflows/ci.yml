name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: "npm"

      - name: Install Node.js dependencies
        run: npm ci

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Install headless MuJoCo renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libosmesa6

      - name: Configure LCM receive buffers
        run: sudo sysctl -p deploy/90-humanoid-lcm.conf

      - name: Run checks (includes tests)
        env:
          MUJOCO_GL: osmesa
        run: uv run check
