[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "humanoid"
version = "0.2.0"
description = "A Python framework for multi-robot control and teleoperation in simulation and on real hardware"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "flask>=3.1.3",
    "lcm>=1.5.2",
    "meshcat>=0.3.2",
    "mujoco~=3.10.0",
    "numpy>=2.0.0",
    "oculus-reader",
    "pin>=3.2.0",
    "pin-pink>=4.0.0",
    "pillow>=11.0",
    "pynput>=1.8.1",
    "pyrealsense2>=2.56.5,<3; sys_platform != 'darwin'",
    "pyserial>=3.5",
    "qpsolvers[open-source-solvers]>=4.8.2",
    "vassar-feetech-servo-sdk>=1.5.0",
    "psutil>=7.2.2,<8",
    "lz4>=4.4,<5",
]

[project.scripts]
start = "humanoid.start:main"
check = "humanoid.check:main"

[dependency-groups]
dev = [
    { include-group = "model-serving" },
    "pytest>=8.0.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15",
    "ty>=0.0.17",
]
perception = [
    { include-group = "model-serving" },
    "torch>=2.6,<3",
    "torchvision>=0.21,<1",
    "ultralytics==8.4.215",
    "huggingface-hub>=0.34,<1",
    "clip",
    "onnx>=1.19,<2",
]
model-serving = [
    "opencv-python>=4.11,<5",
    "onnxruntime>=1.23,<2",
    "tokenizers>=0.22,<0.23",
    "ftfy>=6.3,<7",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    "src/humanoid/types/lcm/*_t.py",  # Auto-generated LCM types
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes (includes unused imports)
    "I",     # isort (import sorting)
    "UP",    # pyupgrade
    "B",     # flake8-bugbear (common bugs and design problems)
    "C4",    # flake8-comprehensions (better list/dict/set comprehensions)
    "SIM",   # flake8-simplify (simplification suggestions)
    "PIE",   # flake8-pie (misc lints)
    "RET",   # flake8-return (return statement issues)
    "PTH",   # flake8-use-pathlib (prefer pathlib over os.path)
    "PL",    # pylint (comprehensive static analysis)
    "PERF",  # perflint (performance anti-patterns)
    "RUF",   # ruff-specific rules
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["humanoid"]

[tool.ty.src]
exclude = [
    "src/humanoid/types/lcm/*_t.py",  # Auto-generated LCM types
]

[tool.ty.environment]
extra-paths = ["typings"]

[tool.ty.analysis]
# Model workers and offline exporters use their own dependency environments.
allowed-unresolved-imports = ["torch", "ultralytics.**", "huggingface_hub", "graspgenx.**", "gsnet", "onnx", "onnxruntime", "tokenizers", "ftfy", "clip"]

[tool.hatch.build.targets.wheel]
packages = ["src/humanoid"]

[tool.uv.sources]
clip = { git = "https://github.com/ultralytics/CLIP.git", rev = "7ffa84b3bfa40c42ecc1c77147a855e69cb2dd40" }
oculus-reader = { git = "https://github.com/rail-berkeley/oculus_reader.git", rev = "17bc7b3923f5754d70c4e358867a3bcac1a3c0c3" }
