[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "humanoid"
version = "0.1.0"
description = "Small household humanoid robot"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alive-progress>=3.3.0",
    "lcm>=1.5.2",
    "pyserial>=3.5",
    "vassar-feetech-servo-sdk>=1.5.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0.0",
    "ruff>=0.15",
]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [
    "src/humanoid/types/lcm/*.py",  # Auto-generated LCM types
]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes (includes unused imports)
    "I",     # isort (import sorting)
    "UP",    # pyupgrade
    "B",     # flake8-bugbear (common bugs and design problems)
    "C4",    # flake8-comprehensions (better list/dict/set comprehensions)
    "SIM",   # flake8-simplify (simplification suggestions)
    "PIE",   # flake8-pie (misc lints)
    "RET",   # flake8-return (return statement issues)
    "PTH",   # flake8-use-pathlib (prefer pathlib over os.path)
    "PL",    # pylint (comprehensive static analysis)
    "PERF",  # perflint (performance anti-patterns)
    "RUF",   # ruff-specific rules
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["humanoid"]

[tool.hatch.build.targets.wheel]
packages = ["src/humanoid"]
