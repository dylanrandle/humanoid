[project]
name = "triskel-development"
version = "0.2.0"
description = "Development tools for the ROS 2 Triskel workspace"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pyyaml>=6.0.3",
    "ruff>=0.15",
    "setuptools>=80.0.0",
    "ty>=0.0.17",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes (includes unused imports)
    "I",     # isort (import sorting)
    "UP",    # pyupgrade
    "B",     # flake8-bugbear (common bugs and design problems)
    "C4",    # flake8-comprehensions (better list/dict/set comprehensions)
    "SIM",   # flake8-simplify (simplification suggestions)
    "PIE",   # flake8-pie (misc lints)
    "RET",   # flake8-return (return statement issues)
    "PTH",   # flake8-use-pathlib (prefer pathlib over os.path)
    "PL",    # pylint (comprehensive static analysis)
    "PERF",  # perflint (performance anti-patterns)
    "RUF",   # ruff-specific rules
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["triskel_operator", "triskel_visualization"]

[tool.ty.src]
exclude = [
    # ./triskel check covers these in a second pass while ignoring only unavailable ROS imports.
    "ros_ws/src/*/launch/*.py",
    "ros_ws/src/triskel_operator/triskel_operator/node.py",
    "ros_ws/src/triskel_operator/triskel_operator/quest_bridge.py",
    "ros_ws/src/triskel_visualization/triskel_visualization/node.py",
]
